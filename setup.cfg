[metadata]
name = autotrain-bench
version = 0.0.0
description = A minimal reference supervisor for autonomous training research benchmarks.
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = autotrain_bench*

[options.entry_points]
console_scripts =
    autotrain-bench = autotrain_bench.cli:main
