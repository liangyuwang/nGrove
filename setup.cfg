[metadata]
name = ngrove
version = 0.0.0
description = Autonomous research environments and trajectories for recursive self-improvement.
url = https://github.com/liangyuwang/nGrove
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include =
    envcore*
    ngrove*

[options.entry_points]
console_scripts =
    ngrove = envcore.cli:main
