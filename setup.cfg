[metadata]
name = autotrain-bench
version = 0.0.0
description = Configurable environments for autonomous research, with benchmark protocols.
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include =
    envcore*
    benchcore*

[options.entry_points]
console_scripts =
    envcore = envcore.cli:main
    autotrain-bench = envcore.cli:main
